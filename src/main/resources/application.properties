spring.application.name=gestion-club

# ---- Datasource (SQLite) ----
# Configurar mediante variables de entorno. Ver README.
spring.datasource.url=jdbc:sqlite:gestion-club.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# ---- JPA / Hibernate ----
# "update" simplifica el desarrollo inicial. Se puede migrar a una
# herramienta de migraciones (Flyway/Liquibase) mas adelante si el
# proyecto lo requiere.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.open-in-view=false

# ---- Thymeleaf ----
spring.thymeleaf.cache=false

# ---- Usuario administrador inicial (opcional) ----
# Si se definen ambas variables de entorno y no hay usuarios cargados,
# se crea un usuario ADMINISTRADOR al arrancar la aplicacion.
app.admin.username=${ADMIN_USERNAME:}
app.admin.password=${ADMIN_PASSWORD:}

# ---- Cuotas ----
# Importe utilizado al generar las cuotas mensuales, y dia del mes usado
# como vencimiento (se ajusta automaticamente si el mes tiene menos dias,
# por ejemplo febrero).
app.cuota.importe-mayor-por-defecto=5000
app.cuota.importe-menor-por-defecto=3000
app.cuota.importe-jubilado-por-defecto=3000
app.cuota.dia-vencimiento=10