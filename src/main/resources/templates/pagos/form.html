<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${esEdicion} ? 'Editar pago - Club' : 'Nuevo pago - Club'">Pago - Club</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
</head>
<body>
<header th:replace="~{fragments/nav :: nav}"></header>
<main class="container">
    <h1 th:text="${esEdicion} ? 'Editar pago' : 'Registrar pago'">Pago</h1>

    <div class="alert alert-danger" th:if="${errorNegocio}" th:text="${errorNegocio}"></div>

    <div class="alert alert-warning"
         th:if="${!esEdicion and #lists.isEmpty(cuotasPendientes)}">
        No hay cuotas pendientes para registrar un pago. Generá las cuotas del período
        desde la sección <a th:href="@{/cuotas}">Cuotas</a>.
    </div>

    <form method="post"
          th:action="${esEdicion} ? @{/pagos/{id}(id=${pagoId})} : @{/pagos}"
          th:object="${pagoForm}">

        <div class="row">

            <!-- Cuota: seleccionable solo al crear; fija en la edición -->
            <div class="col-md-6 mb-3">
                <label class="form-label" for="cuotaId">Cuota a abonar</label>

                <select th:if="${!esEdicion}"
                        class="form-select"
                        id="cuotaId"
                        th:field="*{cuotaId}"
                        required="required"
                        th:disabled="${#lists.isEmpty(cuotasPendientes)}">
                    <option value="">Seleccionar cuota...</option>
                    <option th:each="cuota : ${cuotasPendientes}"
                            th:value="${cuota.id}"
                            th:attr="data-importe=${cuota.importe}"
                            th:text="|${cuota.socio.apellido}, ${cuota.socio.nombre} (N° ${cuota.socio.numeroSocio}) — ${cuota.mes}/${cuota.anio} — $${cuota.importe}|">
                    </option>
                </select>
                <div class="text-danger small" th:if="${#fields.hasErrors('cuotaId')}" th:errors="*{cuotaId}"></div>

                <!-- En edición se muestra la cuota como texto fijo (no editable) -->
                <div th:if="${esEdicion}" class="form-control-plaintext">
                    <span th:text="|${pago.cuota.socio.apellido}, ${pago.cuota.socio.nombre} (N° ${pago.cuota.socio.numeroSocio}) — ${pago.cuota.mes}/${pago.cuota.anio}|"></span>
                </div>
                <input th:if="${esEdicion}" type="hidden" th:field="*{cuotaId}"/>
            </div>

            <!-- Medio de pago -->
            <div class="col-md-6 mb-3">
                <label class="form-label" for="medioPago">Medio de pago</label>
                <select class="form-select" id="medioPago" th:field="*{medioPago}" required="required">
                    <option value="">Seleccionar...</option>
                    <option th:each="medio : ${T(com.club.gestion.pago.PagoMedio).values()}"
                            th:value="${medio}" th:text="${medio}"></option>
                </select>
                <div class="text-danger small" th:if="${#fields.hasErrors('medioPago')}" th:errors="*{medioPago}"></div>
            </div>
        </div>

        <div class="row">

            <!-- Importe -->
            <div class="col-md-6 mb-3">
                <label class="form-label" for="importe">Importe abonado</label>
                <input type="number" step="1" min="1" class="form-control" id="importe"
                       th:field="*{importe}" required="required"/>
                <div class="text-danger small" th:if="${#fields.hasErrors('importe')}" th:errors="*{importe}"></div>
            </div>

            <!-- Fecha de pago -->
            <div class="col-md-6 mb-3">
                <label class="form-label" for="fechaPago">Fecha del pago</label>
                <input type="date" class="form-control" id="fechaPago"
                       th:field="*{fechaPago}" required="required"/>
                <div class="text-danger small" th:if="${#fields.hasErrors('fechaPago')}" th:errors="*{fechaPago}"></div>
            </div>
        </div>

        <button type="submit" class="btn btn-primary"
                th:disabled="${!esEdicion and #lists.isEmpty(cuotasPendientes)}">
            Guardar
        </button>
        <a th:href="@{/pagos}" class="btn btn-secondary">Cancelar</a>
    </form>
</main>

<script th:src="@{/js/pagos-form.js}"></script>
</body>
</html>
