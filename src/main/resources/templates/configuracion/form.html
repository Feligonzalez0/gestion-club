<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Configuración - Club</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet"
          th:href="@{/css/styles.css}"/>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
</head>

<body>

<header th:replace="~{fragments/nav :: nav}"></header>

<main class="container">

    <h1>Configuración</h1>

    <p class="text-muted">
        Configuración general de las cuotas del club.
    </p>

    <div th:if="${mensajeExito}"
         class="alert alert-success"
         role="alert"
         th:text="${mensajeExito}">
    </div>

    <div th:if="${errorNegocio}"
         class="alert alert-danger"
         role="alert"
         th:text="${errorNegocio}">
    </div>

    <div class="card mt-4">
        <div class="card-body">

            <h5 class="card-title">Cuotas</h5>

            <form th:action="@{/configuracion}" method="post"
                data-confirm="¿Guardar los cambios en la configuración de cuotas?"
                data-confirm-title="Guardar configuración"
                data-confirm-icon="bi-floppy2-fill"
                data-confirm-button="Guardar"
                data-confirm-variant="btn-primary"
                >

                <div class="mb-3">
                    <label for="importeCuotaMayor"
                           class="form-label">
                        Cuota para mayores
                    </label>

                    <div class="input-group">
                        <span class="input-group-text">$</span>

                        <input type="number"
                               class="form-control"
                               id="importeCuotaMayor"
                               name="importeCuotaMayor"
                               min="1"
                               step="1"
                               required
                               th:value="${configuracion.importeCuotaMayor}"/>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="importeCuotaMenor"
                           class="form-label">
                        Cuota para menores
                    </label>

                    <div class="input-group">
                        <span class="input-group-text">$</span>

                        <input type="number"
                               class="form-control"
                               id="importeCuotaMenor"
                               name="importeCuotaMenor"
                               min="1"
                               step="1"
                               required
                               th:value="${configuracion.importeCuotaMenor}"/>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="importeCuotaJubilado"
                           class="form-label">
                        Cuota para jubilados
                    </label>

                    <div class="input-group">
                        <span class="input-group-text">$</span>

                        <input type="number"
                               class="form-control"
                               id="importeCuotaJubilado"
                               name="importeCuotaJubilado"
                               min="1"
                               step="1"
                               required
                               th:value="${configuracion.importeCuotaJubilado}"/>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="diaVencimiento"
                           class="form-label">
                        Día de vencimiento
                    </label>

                    <input type="number"
                           class="form-control"
                           id="diaVencimiento"
                           name="diaVencimiento"
                           min="1"
                           max="31"
                           required
                           th:value="${configuracion.diaVencimiento}"/>

                    <div class="form-text">
                        Día del mes en el que vencen las cuotas.
                    </div>
                </div>

                <button type="submit"
                        class="btn btn-primary">
                    Guardar configuración
                </button>

            </form>

        </div>
    </div>

</main>

<div th:replace="~{fragments/confirm-modal :: confirmModal}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/confirm-modal.js}"></script>
</body>
</html>
