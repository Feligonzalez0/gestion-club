<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Editar cuota - Club</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
</head>
<body>
<header th:replace="~{fragments/nav :: nav}"></header>
<main class="container">
    <h1>Editar cuota</h1>

    <div class="alert alert-danger" th:if="${errorNegocio}" th:text="${errorNegocio}"></div>

    <form method="post"
          th:action="@{/cuotas/{id}(id=${cuotaId})}"
          th:object="${cuotaForm}">

        <div class="row">

            <!-- Socio: dato fijo, no editable -->
            <div class="col-md-6 mb-3">
                <label class="form-label">Socio</label>
                <div class="form-control-plaintext"
                     th:text="|${cuota.socio.apellido}, ${cuota.socio.nombre} (N° ${cuota.socio.numeroSocio})|"></div>
            </div>

            <!-- Periodo y estado: datos fijos, no editables -->
            <div class="col-md-3 mb-3">
                <label class="form-label">Período</label>
                <div class="form-control-plaintext" th:text="|${cuota.mes}/${cuota.anio}|"></div>
            </div>

            <div class="col-md-3 mb-3">
                <label class="form-label">Estado</label>
                <div class="form-control-plaintext">
                    <span class="badge"
                          th:classappend="${cuota.estado.name() == 'VENCIDA'} ? 'bg-danger' : 'bg-warning text-dark'"
                          th:text="${cuota.estado}"></span>
                </div>
            </div>
        </div>

        <div class="row">

            <!-- Importe -->
            <div class="col-md-6 mb-3">
                <label class="form-label" for="importe">Importe</label>
                <input type="number" step="1" min="1" class="form-control" id="importe"
                       th:field="*{importe}" required="required"/>
                <div class="text-danger small" th:if="${#fields.hasErrors('importe')}" th:errors="*{importe}"></div>
            </div>

            <!-- Vencimiento -->
            <div class="col-md-6 mb-3">
                <label class="form-label" for="fechaVencimiento">Vencimiento</label>
                <input type="date" class="form-control" id="fechaVencimiento"
                       th:field="*{fechaVencimiento}" required="required"/>
                <div class="text-danger small" th:if="${#fields.hasErrors('fechaVencimiento')}"
                     th:errors="*{fechaVencimiento}"></div>
                <div class="form-text">
                    Si la nueva fecha ya pasó, la cuota quedará VENCIDA; si no, PENDIENTE.
                </div>
            </div>
        </div>

        <button type="submit" class="btn btn-primary">Guardar</button>
        <a th:href="@{/cuotas(anio=${cuota.anio}, mes=${cuota.mes})}" class="btn btn-secondary">Cancelar</a>
    </form>
</main>
</body>
</html>
