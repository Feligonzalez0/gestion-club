<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${esEdicion} ? 'Editar socio - Club' : 'Nuevo socio - Club'">Socio - Club</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
</head>
<body>
<header th:replace="~{fragments/nav :: nav}"></header>
<main class="container">
    <h1 th:text="${esEdicion} ? 'Editar socio' : 'Nuevo socio'">Socio</h1>

    <div class="alert alert-danger" th:if="${errorNegocio}" th:text="${errorNegocio}"></div>

    <form method="post"
          th:action="${esEdicion} ? @{/socios/{id}(id=${socioId})} : @{/socios}"
          th:object="${socioForm}">

        <div class="row">
            <div class="col-md-4 mb-3" th:if="${esEdicion}">
                <label class="form-label" for="numeroSocio">Numero de socio</label>
                <input type="number" class="form-control" id="numeroSocio" th:field="*{numeroSocio}" required="required"/>
                <div class="text-danger small" th:if="${#fields.hasErrors('numeroSocio')}" th:errors="*{numeroSocio}"></div>
            </div>

            <div class="col-md-4 mb-3">
                <label class="form-label" for="nombre">Nombre</label>
                <input type="text" class="form-control" id="nombre" th:field="*{nombre}" required="required"/>
                <div class="text-danger small" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
            </div>

            <div class="col-md-4 mb-3">
                <label class="form-label" for="apellido">Apellido</label>
                <input type="text" class="form-control" id="apellido" th:field="*{apellido}" required="required"/>
                <div class="text-danger small" th:if="${#fields.hasErrors('apellido')}" th:errors="*{apellido}"></div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-4 mb-3">
                <label class="form-label" for="dni">DNI</label>
                <input type="text" class="form-control" id="dni" th:field="*{dni}" required="required"/>
                <div class="text-danger small" th:if="${#fields.hasErrors('dni')}" th:errors="*{dni}"></div>
            </div>

            <div class="col-md-4 mb-3">
                <label class="form-label" for="fechaNacimiento">Fecha de nacimiento</label>
                <input type="date" class="form-control" id="fechaNacimiento" th:field="*{fechaNacimiento}" required="required"/>
                <div class="text-danger small" th:if="${#fields.hasErrors('fechaNacimiento')}" th:errors="*{fechaNacimiento}"></div>
            </div>

            <div class="col-md-4 mb-3">
                <label class="form-label" for="categoria">Categoria</label>
                <select class="form-select" id="categoria" th:field="*{categoria}" required="required">
                    <option value="">Seleccionar...</option>
                    <option th:each="cat : ${T(com.club.gestion.socio.SocioCategoria).values()}"
                            th:value="${cat}" th:text="${cat}"></option>
                </select>
                <div class="text-danger small" th:if="${#fields.hasErrors('categoria')}" th:errors="*{categoria}"></div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-4 mb-3">
                <label class="form-label" for="telefono">Telefono</label>
                <input type="text" class="form-control" id="telefono" th:field="*{telefono}"/>
            </div>

            <div class="col-md-4 mb-3">
                <label class="form-label" for="direccion">Direccion</label>
                <input type="text" class="form-control" id="direccion" th:field="*{direccion}"/>
            </div>

            <div class="col-md-4 mb-3">
                <label class="form-label" for="email">Email</label>
                <input type="email" class="form-control" id="email" th:field="*{email}"/>
                <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>
        </div>

        <button type="submit" class="btn btn-primary">Guardar</button>
        <a th:href="@{/socios}" class="btn btn-secondary">Cancelar</a>
    </form>
</main>
</body>
</html>
