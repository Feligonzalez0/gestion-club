<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Socios - Club</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
</head>
<body>
<header th:replace="~{fragments/nav :: nav}"></header>
<main class="container">    
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="mb-0">
            Socios
        </h1>    
    </div>

    <div class="alert alert-success" th:if="${mensajeExito}" th:text="${mensajeExito}"></div>
    <div class="alert alert-danger" th:if="${mensajeError}" th:text="${mensajeError}"></div>

    <form method="get" th:action="@{/socios}" class="row g-2 mb-3">
        <div class="col-auto">
            <input type="text" name="q" class="form-control" placeholder="Buscar socio..." th:value="${q}"/>
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-outline-primary">Buscar</button>
        </div>
        <div class="col-auto" th:if="${q != null and !#strings.isEmpty(q)}">
            <a class="btn btn-outline-secondary" th:href="@{/socios}">Ver todos</a>
        </div>
        <div class="col-auto ms-auto">
            <a class="btn btn-primary" th:href="@{/socios/nuevo}">Nuevo socio</a>
            <a class="btn btn-secondary ms-2" th:href="@{/socios/inactivos}">Ver Socios Inactivos</a>
        </div>
    </form>

    <p th:if="${#lists.isEmpty(socios)}" class="text-muted">
        No se encontraron socios.
    </p>

    <table class="table table-striped" th:unless="${#lists.isEmpty(socios)}">
        <thead>
        <tr>
            <th>N&deg; Socio</th>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>DNI</th>
            <th>Telefono</th>
            <th>Categoria</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="socio : ${socios}">
            <td th:text="${socio.numeroSocio}"></td>
            <td th:text="${socio.nombre}"></td>
            <td th:text="${socio.apellido}"></td>
            <td th:text="${socio.dni}"></td>
            <td th:text="${socio.telefono}"></td>
            <td th:text="${socio.categoria}"></td>
            <td>
                <span class="badge"
                      th:classappend="${socio.estado.name() == 'ACTIVO'} ? 'bg-success' : 'bg-secondary'"
                      th:text="${socio.estado}"></span>
            </td>
            <td>
                <a class="btn btn-sm btn-outline-primary" th:href="@{/socios/{id}(id=${socio.id})}">Ver ficha</a>

                <a class="btn btn-sm btn-outline-secondary" th:href="@{/socios/{id}/editar(id=${socio.id})}">Editar</a>

                <form th:if="${socio.estado.name() == 'ACTIVO'}"
                      th:action="@{/socios/{id}/desactivar(id=${socio.id})}"
                      method="post" class="d-inline"
                      data-confirm-title="Desactivar socio"
                      data-confirm="¿Desactivar este socio? El socio será dado de baja."
                      data-confirm-button="Desactivar"
                      data-confirm-variant="btn-warning">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Desactivar</button>
                </form>

                <form th:unless="${socio.estado.name() == 'ACTIVO'}"
                      th:action="@{/socios/{id}/activar(id=${socio.id})}"
                      method="post" class="d-inline"
                      data-confirm="¿Activar este socio?"
                      data-confirm-button="Activar"
                      data-confirm-variant="btn-success">
                    <button type="submit" class="btn btn-sm btn-outline-success">Activar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>

<div th:replace="~{fragments/confirm-modal :: confirmModal}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/confirm-modal.js}"></script>
</body>
</html>
