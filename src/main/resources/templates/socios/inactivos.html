<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Socios Inactivos - Club</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
</head>
<body>
<header th:replace="~{fragments/nav :: nav}"></header>

<main class="container">
    <div class="d-flex align-items-center mb-3">
        <h1 class="mb-0">
            <i class="bi bi-person-fill-slash me-2"></i>Socios Inactivos
        </h1>    
    </div>

    <!-- Manejo de alertas flash -->
    <div class="alert alert-success" th:if="${mensajeExito}" th:text="${mensajeExito}"></div>
    <div class="alert alert-danger" th:if="${mensajeError}" th:text="${mensajeError}"></div>

    <!-- Barra de búsqueda y acciones (Alineada con row g-2 y ms-auto) -->
    <form method="get" th:action="@{/socios/inactivos}" class="row g-2 mb-3">
        <div class="col-auto">
            <input type="text" name="busqueda" class="form-control" placeholder="Buscar inactivos..." th:value="${busqueda}"/>
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-outline-primary">Buscar</button>
        </div>
        <div class="col-auto" th:if="${busqueda != null and !#strings.isEmpty(busqueda)}">
            <a class="btn btn-outline-secondary" th:href="@{/socios/inactivos}">Ver todos</a>
        </div>
        <div class="col-auto ms-auto">
            <a class="btn btn-secondary" th:href="@{/socios}">Volver a Socios Activos</a>
        </div>
    </form>

    <!-- Mensaje si la lista está vacía -->
    <p th:if="${#lists.isEmpty(socios)}" class="text-muted">
        No se encontraron socios inactivos.
    </p>

    <!-- Tabla con el mismo formato y columnas que list.html -->
    <table class="table table-striped" th:unless="${#lists.isEmpty(socios)}">
        <thead>
        <tr>
            <th>N&deg; Socio</th>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>DNI</th>
            <th>Telefono</th>
            <th>Categoria</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="socio : ${socios}">
            <td th:text="${socio.numeroSocio}"></td>
            <td th:text="${socio.nombre}"></td>
            <td th:text="${socio.apellido}"></td>
            <td th:text="${socio.dni}"></td>
            <td th:text="${socio.telefono}"></td>
            <td th:text="${socio.categoria}"></td>
            <td>
                <span class="badge bg-secondary" th:text="${socio.estado}"></span>
            </td>
            <td>
                <!-- Ver ficha -->
                <a class="btn btn-sm btn-outline-primary" th:href="@{/socios/{id}(id=${socio.id})}">Ver ficha</a>

                <!-- Activar -->
                <form th:action="@{/socios/{id}/activar(id=${socio.id})}" method="post" class="d-inline"
                    data-confirm="¿Activar este socio?"
                    data-confirm-button="Activar"
                    data-confirm-variant="btn-success"
                    data-confirm-icon="bi-person-fill-check">
                    <button type="submit" class="btn btn-sm btn-outline-success">Activar</button>
                </form>

                <!-- Eliminar Físico con confirmación -->
                <form th:action="@{/socios/{id}/eliminar(id=${socio.id})}" method="post" class="d-inline"
                      data-confirm="Atención: ¿Estás seguro de eliminar este socio permanentemente? Esta acción no se puede deshacer."
                      data-confirm-title="Eliminar socio"
                      data-confirm-button="Eliminar permanentemente"
                      data-confirm-variant="btn-danger"
                      data-confirm-icon="bi-trash3-fill"
                      >
                    <button type="submit" class="btn btn-sm btn-outline-danger">Eliminar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <div th:replace="~{fragments/paginacion :: paginacion(pagina=${pagina}, urlBase=@{/socios/inactivos(q=${q})})}"></div>
</main>

<div th:replace="~{fragments/confirm-modal :: confirmModal}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/confirm-modal.js}"></script>
</body>
</html>
