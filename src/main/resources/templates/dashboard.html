<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Gestion de socios - Club</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
</head>
<body>
<header th:replace="~{fragments/nav :: nav}"></header>
<main class="container">
    <h1>Gestion de socios - Club</h1>
    <p class="text-muted">Vista inicial del dashboard. Los indicadores completos se agregaran en una fase posterior.</p>

    <div class="row mt-4">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Socios activos</h5>
                    <p class="card-text display-6" th:text="${cantidadSociosActivos}">0</p>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Cuotas pendientes</h5>
                    <p class="card-text display-6" th:text="${cantidadCuotasPendientes}">0</p>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
