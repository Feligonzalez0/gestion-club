<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Dashboard - Club</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <style>
        .kpi-card .card-body {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .kpi-icon {
            width: 3rem;
            height: 3rem;
            min-width: 3rem;
            border-radius: .6rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            color: #ffffff;
        }

        .kpi-value {
            font-size: 1.75rem;
            font-weight: 700;
            line-height: 1.15;
            color: #212529;
        }

        .kpi-label {
            font-size: .8rem;
            color: #6c757d;
            text-transform: uppercase;
            letter-spacing: .03em;
            font-weight: 600;
        }

        .kpi-icon-socios { background: #4A9EFF; }
        .kpi-icon-cuotas { background: #0b1522; }
        .kpi-icon-cobrado { background: #198754; }
        .kpi-icon-pendientes { background: #ffc107; }
        .kpi-icon-vencidas { background: #dc3545; }
        .kpi-icon-porcentaje { background: #0dcaf0; }

        .chart-card canvas {
            max-height: 280px;
        }
    </style>
</head>
<body>
<header th:replace="~{fragments/nav :: nav}"></header>
<main class="container">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h1 class="mb-0">Dashboard</h1>
            <p class="text-muted mb-0">Panorama general del club — <span th:text="${periodoActual}">Mes actual</span></p>
        </div>
    </div>
    
    <!-- Indicadores principales -->
    <div class="row row-cols-3 g-3 mb-4">
        <div class="col">
            <div class="card kpi-card h-100">
                <div class="card-body">
                    <div class="kpi-icon kpi-icon-socios"><i class="bi bi-people-fill"></i></div>
                    <div>
                        <div class="kpi-value" th:text="${cantidadSociosActivos}">0</div>
                        <div class="kpi-label">Socios activos</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col">
            <div class="card kpi-card h-100">
                <div class="card-body">
                    <div class="kpi-icon kpi-icon-cuotas"><i class="bi bi-receipt"></i></div>
                    <div>
                        <div class="kpi-value" th:text="${cuotasDelMes}">0</div>
                        <div class="kpi-label">Cuotas del mes</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col">
            <div class="card kpi-card h-100">
                <div class="card-body">
                    <div class="kpi-icon kpi-icon-cobrado"><i class="bi bi-cash-stack"></i></div>
                    <div>
                        <div class="kpi-value"
                             th:text="|$ ${#numbers.formatInteger(importeCobradoMes, 1, 'POINT')}|">$ 0</div>
                        <div class="kpi-label">Cobrado este mes</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col">
            <div class="card kpi-card h-100">
                <div class="card-body">
                    <div class="kpi-icon kpi-icon-pendientes"><i class="bi bi-hourglass-split"></i></div>
                    <div>
                        <div class="kpi-value" th:text="${cuotasPendientes}">0</div>
                        <div class="kpi-label">Cuotas pendientes</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col">
            <div class="card kpi-card h-100">
                <div class="card-body">
                    <div class="kpi-icon kpi-icon-vencidas"><i class="bi bi-exclamation-triangle-fill"></i></div>
                    <div>
                        <div class="kpi-value" th:text="${cuotasVencidas}">0</div>
                        <div class="kpi-label">Cuotas vencidas</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col">
            <div class="card kpi-card h-100">
                <div class="card-body">
                    <div class="kpi-icon kpi-icon-porcentaje"><i class="bi bi-percent"></i></div>
                    <div>
                        <div class="kpi-value" th:text="|${porcentajeCobranza}%|">0%</div>
                        <div class="kpi-label">% de cobranzas</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Graficos -->
    <div class="row g-3 mb-4">
        <div class="col-6">
            <div class="card chart-card h-100">
                <div class="card-body">
                    <h5 class="card-title mb-3">Estado de cuotas del mes</h5>
                    <canvas id="graficoEstadoCuotas"></canvas>
                </div>
            </div>
        </div>

        <div class="col-6">
            <div class="card chart-card h-100">
                <div class="card-body">
                    <h5 class="card-title mb-3">Socios activos por categoría</h5>
                    <canvas id="graficoSociosCategoria"></canvas>
                </div>
            </div>
        </div>
    </div>

</main>

<script th:inline="javascript">
/*<![CDATA[*/
    const cuotasPagadas = /*[[${cuotasPagadas}]]*/ 0;
    const cuotasPendientes = /*[[${cuotasPendientes}]]*/ 0;
    const cuotasVencidas = /*[[${cuotasVencidas}]]*/ 0;

    const sociosMayor = /*[[${sociosMayor}]]*/ 0;
    const sociosMenor = /*[[${sociosMenor}]]*/ 0;
    const sociosJubilado = /*[[${sociosJubilado}]]*/ 0;

    new Chart(document.getElementById('graficoEstadoCuotas'), {
        type: 'doughnut',
        data: {
            labels: ['Pagadas', 'Pendientes', 'Vencidas'],
            datasets: [{
                data: [cuotasPagadas, cuotasPendientes, cuotasVencidas],
                backgroundColor: ['#198754', '#ffc107', '#dc3545'],
                borderWidth: 0
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: { position: 'bottom' }
            }
        }
    });

    new Chart(document.getElementById('graficoSociosCategoria'), {
        type: 'bar',
        data: {
            labels: ['Mayores', 'Menores', 'Jubilados'],
            datasets: [{
                label: 'Socios activos',
                data: [sociosMayor, sociosMenor, sociosJubilado],
                backgroundColor: ['#4A9EFF', '#0dcaf0', '#6f42c1'],
                borderRadius: 6,
                maxBarThickness: 70
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: { display: false }
            },
            scales: {
                y: { beginAtZero: true, ticks: { precision: 0 } }
            }
        }
    });
/*]]>*/
</script>

</body>
</html>
